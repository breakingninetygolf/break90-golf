name: Daily Golf Finds
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-golf-finds
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/publish-daily-finds.mjs
      - run: npm run build
      - name: Publish if changed
        run: |
          if git diff --quiet -- src/data/daily-finds.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-finds.json
          git commit -m "Publish Daily Golf Finds"
          git push
