name: Publish Gear batch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'

permissions:
  contents: write

concurrency:
  group: publish-gear-batch
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.GEAR_BATCH_AUTO_PUBLISH == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/release-gear-batch.mjs
      - name: Build and validate the release
        run: |
          if git diff --quiet -- src/data/products.json; then exit 0; fi
          npm run build
          node scripts/verify-gear-build.mjs
      - name: Publish to main
        id: push
        run: |
          if git diff --quiet -- src/data/products.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/products.json
          git commit -m 'Publish five Break 90 Golf Gear products'
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Verify production Gear page
        if: steps.push.outputs.published == 'true'
        run: node scripts/verify-gear-build.mjs --live
